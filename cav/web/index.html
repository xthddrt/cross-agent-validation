<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAV</title>
<style>
  :root {
    color-scheme: dark;
    --bg:#0d1117; --panel:#161b22; --sunk:#0f141a; --line:#2a313a; --fg:#e6edf3; --dim:#8b949e;
    --ok:#3fb950; --ok-bg:#12261a; --warn:#d29922; --warn-bg:#2a2210; --bad:#f85149; --bad-bg:#2d1416;
    --accent:#58a6ff; --accent-bg:#11233a;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 system-ui, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width:1500px; margin:0 auto; padding:16px 20px 40px; display:flex; flex-direction:column; gap:14px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; }
  h2 { font-size:13px; font-weight:600; color:var(--dim); text-transform:uppercase; letter-spacing:.05em; margin:0 0 10px; }
  .mono { font-family:var(--mono); font-size:12.5px; }
  .dim { color:var(--dim); }
  button { font:inherit; color:inherit; cursor:pointer; }

  /* header */
  header { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  header h1 { font-size:20px; margin:0; font-weight:650; }
  .badge { font-weight:600; font-size:13px; padding:3px 12px; border-radius:999px; background:var(--sunk); color:var(--dim); }
  .badge.run { background:var(--accent-bg); color:var(--accent); }
  .badge.ok { background:var(--ok-bg); color:var(--ok); }
  .badge.bad { background:var(--bad-bg); color:var(--bad); }
  .badge.warn { background:var(--warn-bg); color:var(--warn); }
  .badge.run::before { content:""; display:inline-block; width:7px; height:7px; border-radius:50%; background:currentColor;
                       margin-right:7px; vertical-align:1px; animation:pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity:.25; } }
  #meta { color:var(--dim); font-size:13px; margin-left:auto; }
  #meta .stale { color:var(--warn); }

  /* round tabs */
  #tabs { display:flex; gap:8px; flex-wrap:wrap; }
  #tabs button { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px 14px; text-align:left; }
  #tabs button.on { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
  #tabs b { display:block; font-size:14px; }
  #tabs span { font-size:12px; }

  /* process stepper */
  #process { padding:16px 18px 14px; }
  .steps { display:grid; grid-template-columns:repeat(7, 1fr); }
  .step { position:relative; padding:0 6px; text-align:center; min-width:0; }
  .step::before { content:""; position:absolute; top:13px; left:-50%; width:100%; height:2px; background:var(--line); z-index:0; }
  .step:first-child::before { display:none; }
  .step.done::before, .step.good::before, .step.bad::before, .step.warn::before, .step.active::before { background:var(--ok); }
  .dot { position:relative; z-index:1; width:28px; height:28px; border-radius:50%; margin:0 auto 6px; display:grid; place-items:center;
         font-size:13px; font-weight:700; background:var(--panel); border:2px solid var(--line); color:var(--dim); }
  .step.done .dot, .step.good .dot { background:var(--ok); border-color:var(--ok); color:var(--bg); }
  .step.bad .dot { background:var(--bad); border-color:var(--bad); color:var(--bg); }
  .step.warn .dot { background:var(--warn); border-color:var(--warn); color:var(--bg); }
  .step.active .dot { border-color:var(--accent); color:var(--accent); box-shadow:0 0 0 4px var(--accent-bg); animation:pulse 1.4s infinite; }
  .step.skip { opacity:.45; }
  .step .lbl { font-weight:600; font-size:13px; }
  .step .sub { font-size:12px; color:var(--dim); overflow-wrap:anywhere; }
  .step.bad .sub { color:var(--bad); }
  .step.warn .sub { color:var(--warn); }
  #notes { margin-top:12px; display:flex; flex-direction:column; gap:4px; }
  #notes div { font-size:13px; padding:4px 10px; border-radius:6px; }
  #notes .warn { background:var(--warn-bg); color:var(--warn); }
  #notes .bad { background:var(--bad-bg); color:var(--bad); }
  #notes .info { background:var(--accent-bg); color:var(--accent); }

  /* agents */
  .agents { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .agent { display:flex; flex-direction:column; min-width:0; }
  .ahead { padding:12px 16px 10px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:6px; }
  .arow { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .arow h3 { margin:0; font-size:17px; }
  .arow .model { font-size:12px; color:var(--dim); font-family:var(--mono); }
  .arow .badge { margin-left:auto; }
  .stats { display:flex; gap:16px; flex-wrap:wrap; font-size:13px; color:var(--dim); }
  .stats b { color:var(--fg); font-weight:600; font-variant-numeric:tabular-nums; }
  .stats .idle-warn b { color:var(--warn); }
  .now { font-size:13px; color:var(--accent); font-family:var(--mono); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-height:19px; }
  .result { display:flex; gap:8px; flex-wrap:wrap; align-items:center; font-size:12.5px; }
  .chip { padding:1px 8px; border-radius:5px; background:var(--sunk); color:var(--dim); white-space:nowrap; }
  .chip.ok { background:var(--ok-bg); color:var(--ok); }
  .chip.bad { background:var(--bad-bg); color:var(--bad); }
  .chip.warn { background:var(--warn-bg); color:var(--warn); }
  .links { margin-left:auto; display:flex; gap:4px; }
  .links button { background:none; border:1px solid var(--line); border-radius:6px; padding:1px 9px; font-size:12.5px; color:var(--dim); }
  .links button:hover { color:var(--accent); border-color:var(--accent); }

  .feed { height:52vh; min-height:280px; overflow-y:auto; padding:10px 14px 16px; display:flex; flex-direction:column; gap:6px; }
  .msg { background:var(--sunk); border:1px solid var(--line); border-radius:8px; padding:8px 11px; white-space:pre-wrap;
         overflow-wrap:anywhere; max-height:16em; overflow:hidden; position:relative; cursor:pointer; }
  .msg.open { max-height:none; }
  .msg:not(.open).long::after { content:"click to expand"; position:absolute; left:0; right:0; bottom:0; padding:18px 11px 4px;
                                font-size:12px; color:var(--accent); background:linear-gradient(transparent, var(--sunk) 60%); }
  .msg .ts { display:block; font-size:11px; color:var(--dim); margin-bottom:2px; }
  .msg.think { font-style:italic; color:var(--dim); }
  .tool { font-family:var(--mono); font-size:12px; color:var(--dim); padding:1px 0 1px 10px; border-left:2px solid var(--line);
          white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:default; }
  .tool .t { color:var(--fg); }
  .tool.fail { border-left-color:var(--bad); }
  .tool.fail .x { color:var(--bad); }
  .tool.has-out { cursor:pointer; }
  .tool.open { white-space:normal; }
  .tool.open pre { display:block; }
  .tool pre { display:none; margin:4px 0 2px; white-space:pre-wrap; max-height:220px; overflow:auto; background:var(--sunk); padding:6px 8px; border-radius:6px; }
  .divider { text-align:center; font-size:12px; color:var(--dim); margin:6px 0; display:flex; align-items:center; gap:10px; }
  .divider::before, .divider::after { content:""; flex:1; height:1px; background:var(--line); }
  .empty { color:var(--dim); font-style:italic; margin:auto; }

  /* agreement */
  .agree { display:grid; grid-template-columns:minmax(300px, 1fr) 2fr; gap:14px; }
  .agree > .card { padding:14px 16px; min-width:0; }
  .gates { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
  .gates li { display:flex; gap:10px; align-items:baseline; }
  .gates .i { width:18px; text-align:center; font-weight:700; flex:none; }
  .gates .pass .i { color:var(--ok); }
  .gates .fail .i { color:var(--bad); }
  .gates .fail { font-weight:600; }
  .gates .info { color:var(--dim); }
  .gates .d { margin-left:auto; color:var(--dim); font-size:12.5px; text-align:right; }
  .verdict { margin-top:12px; padding:8px 12px; border-radius:8px; font-weight:600; }
  .verdict.ok { background:var(--ok-bg); color:var(--ok); }
  .verdict.warn { background:var(--warn-bg); color:var(--warn); }

  .files { list-style:none; margin:0; padding:0; max-height:280px; overflow:auto; }
  .files li { display:flex; gap:10px; align-items:center; padding:4px 6px; border-radius:6px; cursor:pointer; }
  .files li:hover { background:var(--sunk); }
  .files .p { font-family:var(--mono); font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .files .n { margin-left:auto; font-family:var(--mono); font-size:12px; flex:none; }
  .add { color:var(--ok); } .del { color:var(--bad); }

  /* modal */
  dialog { width:min(1100px, 94vw); max-height:88vh; padding:0; border:1px solid var(--line); border-radius:12px;
           background:var(--panel); color:var(--fg); }
  dialog::backdrop { background:rgba(0,0,0,.45); }
  .mhead { display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--panel); }
  .mhead b { font-size:15px; }
  .mhead button { margin-left:auto; background:none; border:0; font-size:20px; color:var(--dim); }
  .mbody { padding:14px 16px 18px; overflow:auto; max-height:calc(88vh - 50px); }
  .mbody pre { margin:0; white-space:pre-wrap; overflow-wrap:anywhere; font-family:var(--mono); font-size:12.5px; line-height:1.55; }
  .diff .a { color:var(--ok); } .diff .r { color:var(--bad); } .diff .h { color:var(--accent); } .diff .m { color:var(--dim); }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--dim); font-weight:600; font-size:12px; }
  .mbody h4 { margin:16px 0 6px; font-size:13px; color:var(--dim); }
  .mbody h4:first-child { margin-top:0; }

  @media (max-width: 1000px) {
    .agents, .agree { grid-template-columns:1fr; }
    .steps { grid-template-columns:repeat(4, 1fr); row-gap:14px; }
    .step::before { display:none; }
  }
  @media (max-width: 560px) {
    .wrap { padding:12px 16px 30px; }
    .steps { grid-template-columns:repeat(2, 1fr); }
    #meta { margin-left:0; width:100%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="case">CAV</h1>
    <span class="badge" id="status">connecting</span>
    <span id="meta"></span>
  </header>

  <nav id="tabs"></nav>

  <section class="card" id="process">
    <div class="steps" id="steps"></div>
    <div id="notes"></div>
  </section>

  <section class="agents">
    <article class="card agent" id="agent0"></article>
    <article class="card agent" id="agent1"></article>
  </section>

  <section class="agree">
    <div class="card"><h2>Agreement gates</h2><div id="gates"></div></div>
    <div class="card"><h2>Where the two candidates differ</h2><div id="divergence"></div></div>
  </section>
</div>

<dialog id="modal">
  <div class="mhead"><b id="mtitle"></b><button onclick="document.getElementById('modal').close()" aria-label="Close">&times;</button></div>
  <div class="mbody" id="mbody"></div>
</dialog>

<script>
const TOKEN = location.pathname.split('/').filter(Boolean)[0];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sha = (s) => String(s || '').slice(0, 8);
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const differ = (n) => `${plural(n, 'path')} ${n === 1 ? 'differs' : 'differ'}`;

function dur(sec) {
  sec = Math.max(0, Math.floor(sec || 0));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  if (h) return `${h}h ${String(m).padStart(2, '0')}m`;
  if (m) return `${m}m ${String(s).padStart(2, '0')}s`;
  return `${s}s`;
}
async function api(name, query = {}) {
  try {
    const r = await fetch(`/${TOKEN}/api/${name}?` + new URLSearchParams(query), {cache:'no-store'});
    return r.ok ? await r.text() : '';
  } catch (e) { return ''; }
}
const parse = (text) => { try { return JSON.parse(text); } catch (e) { return null; } };

// ------------------------------------------------------------------ model
// Everything per round is rebuilt from events.jsonl; state.json adds the per-round results.
let state = {}, names = [], selected = null, follow = true;
const rounds = {};

function R(n) {
  return rounds[n] ||= {n, starts:null, ledger:0, start:null, agents:{}, reviews:{}, checks:{}, div:null,
                        verdict:null, blockers:null, notes:[], fin:{}};
}
function A(r, name) {
  return r.agents[name] ||= {name, model:null, launch:null, last:null, done:null,
                             steps:0, tools:0, texts:0, feed:[]};
}
function toolTarget(input) {
  if (!input || typeof input !== 'object') return '';
  for (const k of ['command', 'filePath', 'path', 'pattern', 'description', 'query', 'url'])
    if (input[k]) return String(input[k]);
  return JSON.stringify(input).slice(0, 160);
}
function refresh(item) { if (item.el) fillItem(item.el, item); }

function apply(e) {
  const d = e.data || {}, t = e.type, who = e.agent, ts = e.ts ? Date.parse(e.ts) : Date.now();
  if (!e.round) return;
  const r = R(e.round);
  const a = who ? A(r, who) : null;
  if (a) a.last = ts;
  switch (t) {
    case 'round.prepared':
      // agent order is the case's order, from the starting points: stable across reloads
      r.starts = d.starts || {}; r.ledger = d.ledger || 0;
      if (!names.length) names = Object.keys(r.starts);
      break;
    case 'publication.selected': r.fin.published = {agent:who, reason:d.reason}; break;
    case 'round.start': r.start = ts; break;
    case 'agent.launch':
      if (a.launch) a.feed.push({k:'div', text:'retry'});
      a.launch = ts; a.done = null; a.model = d.model || a.model;
      break;
    case 'agent.text':
    case 'agent.thinking': {
      const text = d.text || '';
      if (!text.trim()) break;
      const kind = t === 'agent.text' ? 'text' : 'think';
      const last = a.feed[a.feed.length - 1];
      // Kimi re-emits a part every time it grows: replace the growing message instead of repeating it.
      if (last && last.k === kind && text.startsWith(last.text)) { last.text = text; refresh(last); }
      else { a.feed.push({k:kind, text, ts}); if (kind === 'text') a.texts++; }
      break;
    }
    case 'agent.tool.start': {
      const item = {k:'tool', tool:d.tool || 'tool', target:toolTarget(d.input), ts};
      const last = a.feed[a.feed.length - 1];
      if (last && last.k === 'tool' && last.exit === undefined && last.tool === item.tool && last.target === item.target) break;
      a.feed.push(item); a.tools++;
      break;
    }
    case 'agent.tool.end':
      for (let i = a.feed.length - 1; i >= 0; i--) {
        const f = a.feed[i];
        if (f.k === 'tool' && f.exit === undefined && f.tool === (d.tool || 'tool')) {
          f.exit = typeof d.exit === 'number' ? d.exit : null;
          f.out = d.output_tail || '';
          refresh(f);
          break;
        }
      }
      break;
    case 'agent.step': a.steps = d.messages || a.steps; break;
    case 'agent.done': a.done = {ok:d.ok, reason:d.reason, ts}; break;
    case 'agent.retry': r.notes.push(['warn', `Retry ${d.attempt} for ${(d.agents || []).join(' and ')}: the previous attempt left no usable review`]); break;
    case 'agent.blocked': r.notes.push(['bad', `${who} stopped on a human-approval prompt (${d.detail}) and was aborted`]); break;
    case 'review.validated': r.reviews[who] = {ok:true}; break;
    case 'review.rejected': {
      const why = d.reason || (d.errors || [])[0] || 'invalid';
      r.reviews[who] = {ok:false, why};
      r.notes.push(['bad', `${who}'s review was rejected: ${why}`]);
      break;
    }
    case 'agent.unexplained_change':
      r.notes.push(['warn', `${who} changed ${plural((d.paths || []).length, 'already-agreed file')} without declaring it: ${(d.paths || []).slice(0, 4).join(', ')}`]);
      break;
    case 'check.start': (r.checks[who] ||= []).push({cmd:d.command}); break;
    case 'check.result': {
      const list = r.checks[who] ||= [];
      const open = [...list].reverse().find(c => c.cmd === d.command && c.exit === undefined);
      if (open) Object.assign(open, {exit:d.exit, sec:d.seconds});
      else list.push({cmd:d.command, exit:d.exit, sec:d.seconds});
      break;
    }
    case 'divergence.computed': r.div = {identical:d.identical, differing:d.differing}; break;
    case 'convergence.evaluated': r.verdict = d.verdict; r.blockers = d.blockers; break;
    case 'oscillation.detected': r.osc = true; r.notes.push(['bad', 'The candidate pair repeated an earlier round, so the run stopped (oscillation)']); break;
    case 'final.complete': r.fin.complete = d; break;
    case 'push.result': r.fin.push = d; break;
  }
}

// ------------------------------------------------------------- derived
const hist = (n) => (state.history || []).find(h => h.round === n) || null;
const runOver = () => !!state.final || state.phase === 'disagreement' || /failed$/.test(state.phase || '');
const isLive = (n) => n === state.round && !runOver();
const roundNumbers = () => {
  const set = new Set([...Object.keys(rounds).map(Number), ...(state.history || []).map(h => h.round)]);
  if (state.round) set.add(state.round);
  return [...set].filter(Boolean).sort((a, b) => a - b);
};
function roundStatus(n) {
  const h = hist(n), r = rounds[n];
  if (h && h.failed) return ['bad', 'failed'];
  const v = (r && r.verdict) || (h && h.verdict);
  if (v === 'accepted') {
    if ((r && r.fin.complete) || (state.final && state.final.round === n)) return ['ok', 'agreed'];
    return isLive(n) ? ['run', 'publishing'] : ['warn', 'accepted, not published'];
  }
  if (v) return ['warn', 'diverged'];
  return isLive(n) ? ['run', 'running'] : ['', 'incomplete'];
}

function steps(n) {
  const r = rounds[n] || R(n), h = hist(n), live = isLive(n);
  const agents = names.map(x => r.agents[x]).filter(Boolean);
  const res = (h && h.results) || {};
  const out = [];

  // each agent starts from its own candidate and must decide on every path where the two differ
  out.push({label:'Starting points', done:!!r.starts,
            sub: r.starts ? 'each from its own' + (r.ledger ? ` · ${plural(r.ledger, 'path')} to decide` : '') : '',
            title: r.starts ? names.map(x => `${x} @ ${sha(r.starts[x])}`).join('\n') : ''});

  const working = agents.filter(a => a.launch && !a.done);
  const agentsDone = names.length === 2 && names.every(x => r.reviews[x] || (r.agents[x] && r.agents[x].done));
  const failedAgent = agents.find(a => a.done && !a.done.ok);
  out.push({label:'Agents work', done:agentsDone && !failedAgent, state:failedAgent && agentsDone ? 'bad' : null,
            sub: working.length ? `${working.length} working` : failedAgent ? `${failedAgent.name}: ${failedAgent.done.reason}`
                 : agentsDone ? 'both finished' : ''});

  const reviews = names.map(x => r.reviews[x]).filter(Boolean);
  const rejected = reviews.find(v => !v.ok);
  const b = r.blockers || (h && h.blockers);
  out.push({label:'Reviews', done:reviews.length === 2 && !rejected, state:rejected ? 'bad' : null,
            sub: rejected ? 'review rejected' : b ? `${b.must_fix_total} MUST_FIX · ${b.blocking_must_fix} blocking`
                 : reviews.length ? `${reviews.length}/2 valid` : ''});

  const cmds = names.flatMap(x => r.checks[x] || []);
  const running = cmds.find(c => c.exit === undefined);
  const histChecks = h && h.checks ? Object.values(h.checks) : null;
  const checksDone = !!(r.div || r.verdict || histChecks);
  const failedCmds = cmds.filter(c => c.exit !== undefined && c.exit !== 0);
  const checksOk = histChecks ? histChecks.every(c => c.ok) : !failedCmds.length;
  const total = histChecks ? histChecks.reduce((s, c) => s + (c.commands || []).length, 0) : cmds.length;
  out.push({label:'Checks', done:checksDone, state:checksDone && !checksOk ? 'bad' : null,
            sub: running ? `running ${running.cmd}` : checksDone ? (total ? (checksOk ? 'all pass' : `${failedCmds.length || 'some'} failed`) : 'none configured')
                 : cmds.length ? `${cmds.length} run` : ''});

  const t = r.div || (h && h.divergence);
  out.push({label:'Compare trees', done:!!t,
            sub: t ? (t.differing ? differ(t.differing) : 'identical trees') : ''});

  const v = r.verdict || (h && h.verdict);
  const accepted = v === 'accepted';
  out.push({label:'Verdict', done:!!v, state:v ? (accepted ? 'good' : 'warn') : null,
            sub: v ? (accepted ? 'both approve' : r.osc ? 'diverged · oscillating' : 'diverged · next round') : ''});

  const f = r.fin;
  let fin;
  if (v && !accepted) fin = {label:'Publish', state:'skip', done:true, sub:'not reached'};
  else if (f.complete) fin = {label:'Publish', done:true, state:'good', title:f.published ? f.published.reason : '',
                              sub:`${f.published ? `${f.published.agent}'s · ` : ''}${sha(f.complete.commit)}${f.push ? ' · pushed' : ' · not pushed'}`};
  else fin = {label:'Publish', done:false, sub:''};
  out.push(fin);

  // the first unfinished step is where the round is now, or where it stopped
  const at = out.find(s => !s.done);
  for (const s of out) s.state = s.state || (s.done ? 'done' : 'todo');
  if (at) {
    if (h && h.failed) { at.state = 'bad'; at.sub = h.failed[0]; }
    else if (live) at.state = 'active';
  }
  return out;
}

// --------------------------------------------------------------- render
function renderHeader() {
  $('case').textContent = state.case || 'CAV';
  document.title = `CAV · ${state.case || ''}`;
  const st = $('status');
  let cls = 'run', text = 'Running';
  if (state.final) { cls = 'ok'; text = `Agreed in round ${state.final.round}`; }
  else if (state.phase === 'disagreement') { cls = 'bad'; text = 'No agreement'; }
  else if (/failed$/.test(state.phase || '')) { cls = 'bad'; text = `Round ${state.round} failed`; }
  else if (!state.phase || state.phase === 'init' || state.phase === 'bootstrap') text = 'Starting';
  st.className = 'badge ' + cls; st.textContent = text;

  const parts = [];
  if (state.final) parts.push(`final ${sha(state.final.commit)}${state.final.pushed ? ' · pushed' : ''}`);
  if (state.run_id) parts.push(state.run_id);
  let html = esc(parts.join(' · '));
  if (state.updated && !runOver()) {
    const age = (Date.now() - Date.parse(state.updated)) / 1000;  // state.updated is local time
    if (age > 300) html += ` · <span class="stale">no state update for ${dur(age)}</span>`;
  }
  $('meta').innerHTML = html;
}

function renderTabs() {
  const nums = roundNumbers();
  const html = nums.map(n => {
    const [cls, label] = roundStatus(n);
    const t = (rounds[n] && rounds[n].div) || (hist(n) && hist(n).divergence);
    const extra = t ? ` · ${differ(t.differing || 0)}` : '';
    const color = {ok:'var(--ok)', bad:'var(--bad)', warn:'var(--warn)', run:'var(--accent)'}[cls] || 'var(--dim)';
    return `<button data-r="${n}" class="${n === selected ? 'on' : ''}"><b>Round ${n}</b>` +
           `<span style="color:${color}">${esc(label)}</span><span class="dim">${esc(extra)}</span></button>`;
  }).join('');
  if ($('tabs')._html === html) return;
  setHtml($('tabs'), html);
  $('tabs').querySelectorAll('button').forEach(b => b.onclick = () => {
    selected = +b.dataset.r;
    follow = selected === state.round;
    render();
  });
}

function renderSteps() {
  if (!selected) { setHtml($('steps'), '<div class="empty">waiting for the first round</div>'); setHtml($('notes'), ''); return; }
  const list = steps(selected);
  const icon = {done:'✓', good:'✓', bad:'✕', warn:'!', skip:'–'};
  setHtml($('steps'), list.map((s, i) =>
    `<div class="step ${s.state}" title="${esc(s.title || '')}"><div class="dot">${icon[s.state] || i + 1}</div>` +
    `<div class="lbl">${esc(s.label)}</div><div class="sub">${esc(s.sub || '')}</div></div>`).join(''));
  setHtml($('notes'), R(selected).notes.map(([cls, text]) => `<div class="${cls}">${esc(text)}</div>`).join(''));
}

// agent cards: the header is redrawn each tick, the feed only appends
const cards = [{}, {}];

function cardSkeleton(i) {
  const el = $('agent' + i);
  el.innerHTML = `<div class="ahead"><div class="arow"></div><div class="stats"></div><div class="now"></div>` +
    `<div class="result"><span class="chips result"></span><span class="links">` +
    `<button data-m="prompt">Prompt</button><button data-m="review">Review</button><button data-m="checks">Checks</button>` +
    `</span></div></div><div class="feed"></div>`;
  el.querySelector('.feed').addEventListener('click', (ev) => {
    const item = ev.target.closest('.msg, .tool.has-out');
    if (item) item.classList.toggle('open');
  });
  el.querySelectorAll('[data-m]').forEach(btn => btn.onclick = () => names[i] && selected && openModal(btn.dataset.m, selected, names[i]));
  const part = (sel) => el.querySelector(sel);
  cards[i] = {key:null, count:0, row:part('.arow'), stats:part('.stats'), now:part('.now'), chips:part('.chips'), feed:part('.feed')};
}
// only touch the DOM when the content changed, so clicks and scroll positions survive the 1s tick
function setHtml(el, html) { if (el._html !== html) { el._html = html; el.innerHTML = html; } }

function fillItem(el, item) {
  if (item.k === 'tool') {
    const fail = typeof item.exit === 'number' && item.exit !== 0;
    el.className = 'tool' + (fail ? ' fail' : '') + (item.out ? ' has-out' : '') + (el.classList.contains('open') ? ' open' : '');
    el.innerHTML = `<span class="t">${esc(item.tool)}</span> ${esc(item.target)}` +
                   (fail ? ` <span class="x">exit ${item.exit}</span>` : '') +
                   (item.out ? `<pre>${esc(item.out)}</pre>` : '');
  } else if (item.k === 'div') {
    el.className = 'divider'; el.textContent = item.text;
  } else {
    const open = el.classList.contains('open');
    el.className = 'msg' + (item.k === 'think' ? ' think' : '') + (open ? ' open' : '');
    const stamp = item.ts ? new Date(item.ts).toLocaleTimeString() : '';
    el.innerHTML = `<span class="ts">${item.k === 'think' ? 'thinking · ' : ''}${esc(stamp)}</span>${esc(item.text)}`;
    el.classList.toggle('long', item.text.length > 700 || item.text.split('\n').length > 14);
  }
}

function renderAgent(i) {
  const card = cards[i];
  const name = names[i];
  if (!name || !selected) { setHtml(card.row, '<span class="dim">waiting for agents</span>'); return; }
  const r = R(selected), a = A(r, name), live = isLive(selected), now = Date.now();
  const res = ((hist(selected) || {}).results || {})[name];
  const sa = live ? (state.agents || {})[name] : null;

  let badge = ['', 'not started'];
  if (a.done) badge = a.done.ok ? ['ok', 'finished'] : ['bad', 'failed'];
  else if (a.launch) badge = live ? ['run', 'working'] : ['warn', 'stopped'];
  if (r.reviews[name] && !r.reviews[name].ok) badge = ['bad', 'review rejected'];

  const end = a.done ? a.done.ts : (live ? now : a.last);
  const elapsed = a.launch ? (end - a.launch) / 1000 : 0;
  const idle = sa && sa.idle !== undefined && sa.state === 'running' ? sa.idle : (a.last && !a.done && live ? (now - a.last) / 1000 : null);
  const stats = [
    `<span>elapsed <b>${a.launch ? dur(elapsed) : '–'}</b></span>`,
    idle !== null ? `<span class="${idle > 300 ? 'idle-warn' : ''}">idle <b>${dur(idle)}</b></span>` : '',
    `<span>steps <b>${(sa && sa.messages) || a.steps || 0}</b></span>`,
    `<span>tools <b>${a.tools}</b></span>`,
    `<span>messages <b>${a.texts}</b></span>`,
  ].join('');

  let now_ = '';
  if (live && !a.done && a.launch) now_ = sa && sa.detail ? `now: ${sa.detail}` : '';
  else if (a.done && !a.done.ok) now_ = a.done.reason;

  const chips = [];
  if (res) {
    const c = res.counts || {};
    chips.push(`<span class="chip mono">${esc(sha(res.commit))}</span>`);
    chips.push(`<span class="chip ${res.blocking ? 'bad' : 'ok'}">${res.blocking} blocking</span>`);
    chips.push(`<span class="chip">MUST ${c.must_fix_total ?? '?'} · SHOULD ${c.should_fix ?? '?'} · NIT ${c.nit ?? '?'}</span>`);
    chips.push(`<span class="chip ${res.approved ? 'ok' : 'bad'}">${res.approved ? '✓' : '✕'} own</span>`);
    chips.push(`<span class="chip ${res.other_approved ? 'ok' : 'bad'}">${res.other_approved ? '✓' : '✕'} other</span>`);
    const ck = ((hist(selected) || {}).checks || {})[name];
    if (ck && (ck.commands || []).length) chips.push(`<span class="chip ${ck.ok ? 'ok' : 'bad'}">checks ${ck.ok ? 'pass' : 'fail'}</span>`);
  }

  setHtml(card.row, `<h3>${esc(name)}</h3><span class="model">${esc(a.model || '')}</span>` +
                    `<span class="badge ${badge[0]}">${esc(badge[1])}</span>`);
  setHtml(card.stats, stats);
  setHtml(card.now, esc(now_));
  card.now.title = now_;
  setHtml(card.chips, chips.join(''));

  // feed
  const key = `${selected}|${name}`;
  if (card.key !== key) { card.key = key; card.count = 0; card.feed.innerHTML = ''; }
  const nearBottom = card.feed.scrollHeight - card.feed.scrollTop - card.feed.clientHeight < 80;
  const fresh = card.count === 0;
  for (; card.count < a.feed.length; card.count++) {
    const item = a.feed[card.count];
    const el = document.createElement('div');
    item.el = el;
    fillItem(el, item);
    card.feed.appendChild(el);
  }
  const empty = card.feed.querySelector('.empty');
  if (!a.feed.length && !empty) card.feed.innerHTML = `<div class="empty">${a.launch ? 'no output yet' : live ? 'waiting for this agent to start' : 'no activity recorded'}</div>`;
  else if (a.feed.length && empty) empty.remove();
  if (fresh || nearBottom) card.feed.scrollTop = card.feed.scrollHeight;
}

function renderGates() {
  const r = selected && R(selected), h = selected && hist(selected);
  const b = r && (r.blockers || (h && h.blockers));
  if (!b) {
    setHtml($('gates'), `<div class="dim">${h && h.failed ? 'This round failed before it could be evaluated.'
      : 'Evaluated after both reviews, the checks and the tree comparison.'}</div>`);
    return;
  }
  const [n0, n1] = names;
  const ap = b.behaviour_approved || [], op = b.other_approved || [];
  const approve = (i) => `own ${ap[i] ? '✓' : '✕'} · other ${op[i] ? '✓' : '✕'}`;
  const rows = [
    ['Every check passes', b.checks, true],
    ['No blocking MUST_FIX', b.blocking_must_fix === 0, true, `${b.blocking_must_fix} blocking of ${b.must_fix_total}`],
    [`${n0} approves both candidates`, ap[0] && op[0], true, approve(0)],
    [`${n1} approves both candidates`, ap[1] && op[1], true, approve(1)],
    ['No open behavioural disagreement', !b.open_behavioural, true],
    ['Trees are byte-identical', b.trees_equal, false],
  ];
  setHtml($('gates'), '<ul class="gates">' + rows.map(([label, ok, required, detail]) => {
    const cls = !required ? 'info' : ok ? 'pass' : 'fail';
    const i = !required ? '·' : ok ? '✓' : '✕';
    const d = detail || (!required ? 'not required' : '');
    return `<li class="${cls}"><span class="i">${i}</span><span>${esc(label)}</span><span class="d">${esc(d)}</span></li>`;
  }).join('') + '</ul>' +
  (b.unexplained_changes ? `<div class="dim" style="margin-top:8px">${plural(b.unexplained_changes, 'undeclared change')} to agreed files (warning only)</div>` : '') +
  `<div class="verdict ${b.eligible ? 'ok' : 'warn'}">${b.eligible ? 'Accepted' : 'Not yet: another round'}</div>`);
}

const divCache = {};
async function renderDivergence() {
  const n = selected;
  const r = n && R(n), h = n && hist(n);
  const totals = r && (r.div || (h && h.divergence));
  if (!totals) {
    $('divergence')._key = null;
    setHtml($('divergence'), `<div class="dim">${n ? 'Compared once both candidates are committed.' : ''}</div>`);
    return;
  }
  const cacheKey = `${n}|${JSON.stringify(totals)}`;
  if (!divCache[cacheKey]) divCache[cacheKey] = parse(await api('divergence', {round:n})) || {};
  if (n !== selected) return;
  const div = divCache[cacheKey], stats = div.stats || {};
  const rows = (div.differing || []).map(p => {
    const s = stats[p] || {};
    return `<li data-p="${esc(p)}"><span class="p" title="${esc(p)}">${esc(p)}</span>` +
           `<span class="n"><span class="add">+${s.added || 0}</span> <span class="del">-${s.removed || 0}</span></span></li>`;
  });
  const [n0, n1] = names;
  if ($('divergence')._key === cacheKey) return;
  $('divergence')._key = cacheKey;
  $('divergence')._html = null;
  $('divergence').innerHTML = `<div class="dim" style="margin-bottom:6px">${differ(totals.differing || 0)} · ${totals.identical || 0} identical</div>` +
    (rows.length ? `<div class="dim" style="font-size:12.5px;margin-bottom:4px">Click a file for the ${esc(n0)} → ${esc(n1)} diff</div><ul class="files">${rows.join('')}</ul>`
                 : `<div class="dim">${totals.differing ? 'File list not available.' : 'The two candidates are identical.'}</div>`);
  $('divergence').querySelectorAll('li[data-p]').forEach(li => li.onclick = () => openModal('diff', n, li.dataset.p));
}

// ---------------------------------------------------------------- modal
async function openModal(kind, round, arg) {
  const titles = {prompt:`Prompt sent to ${arg} · round ${round}`, review:`${arg}'s review · round ${round}`,
                  checks:`${arg}'s checks · round ${round}`, diff:`${arg} · round ${round}`};
  $('mtitle').textContent = titles[kind];
  $('mbody').innerHTML = '<div class="dim">loading…</div>';
  $('modal').showModal();
  let html = '';
  if (kind === 'prompt') {
    const body = parse(await api('prompt', {round, agent:arg})) || {};
    html = body.prompt ? `<pre>${esc(body.prompt)}</pre>` : '<div class="dim">No prompt recorded for this round.</div>';
  } else if (kind === 'review') {
    const text = await api('review', {round, agent:arg});
    const data = parse(text);
    html = data && data.agent ? reviewHtml(data) : (text && text !== '{}' ? `<pre>${esc(text)}</pre>` : '<div class="dim">No review written yet.</div>');
  } else if (kind === 'checks') {
    const data = parse(await api('checks', {round, agent:arg})) || {};
    const cmds = data.commands || [];
    html = cmds.length ? cmds.map(c =>
      `<h4 style="color:${c.exit === 0 ? 'var(--ok)' : 'var(--bad)'}">${c.exit === 0 ? '✓' : '✕'} ${esc(c.command)} · exit ${c.exit} · ${c.seconds}s</h4>` +
      (c.tail ? `<pre>${esc(c.tail)}</pre>` : '')).join('')
      : '<div class="dim">No checks recorded for this agent in this round.</div>';
  } else if (kind === 'diff') {
    const body = parse(await api('diff', {round, path:arg})) || {};
    html = `<pre class="diff">${(body.diff || '(no diff)').split('\n').map(line => {
      const c = /^(\+\+\+|---|diff |index )/.test(line) ? 'm' : line[0] === '+' ? 'a' : line[0] === '-' ? 'r' : line.startsWith('@@') ? 'h' : '';
      return `<span class="${c}">${esc(line)}</span>`;
    }).join('\n')}</pre>`;
  }
  $('mbody').innerHTML = html;
}

function reviewHtml(d) {
  // the orchestrator recomputes counts from the findings; the file holds the agent's own numbers
  const fs = Array.isArray(d.findings) ? d.findings : [];
  const n = (sev, kind) => fs.filter(f => f && f.severity === sev && (!kind || f.kind === kind)).length;
  const c = {must_fix_total:n('MUST_FIX'), blocking_must_fix:n('MUST_FIX', 'behavioral'),
             should_fix:n('SHOULD_FIX'), nit:n('NIT')};
  const yes = (v) => v ? '<span style="color:var(--ok)">✓ yes</span>' : '<span style="color:var(--bad)">✕ no</span>';
  let html = `<div class="result" style="font-size:13px;gap:16px">` +
    `<span>approves own ${yes(d.behavior_approved)}</span><span>approves other ${yes(d.other_behavior_approved)}</span>` +
    `<span>MUST_FIX <b>${c.must_fix_total ?? 0}</b> (blocking <b>${c.blocking_must_fix ?? 0}</b>)</span>` +
    `<span>SHOULD_FIX <b>${c.should_fix ?? 0}</b></span><span>NIT <b>${c.nit ?? 0}</b></span></div>`;
  const table = (title, head, rows) => rows.length
    ? `<h4>${title}</h4><table><tr>${head.map(x => `<th>${x}</th>`).join('')}</tr>${rows.map(r => `<tr>${r.map(x => `<td>${x}</td>`).join('')}</tr>`).join('')}</table>` : '';
  const sev = {MUST_FIX:'bad', SHOULD_FIX:'warn', NIT:''};
  html += table('Findings', ['ID', 'Severity', 'Kind', 'Where', 'Summary', 'Resolution'], (d.findings || []).map(f =>
    [esc(f.id), `<span class="chip ${sev[f.severity] || ''}">${esc(f.severity)}</span>`, esc(f.kind),
     `<span class="mono">${esc(f.path)}:${esc(f.line)}</span>`, esc(f.summary), esc(f.resolution)]));
  html += table('Remaining disagreements', ['Area', 'Kind', 'Note'], (d.remaining_disagreements || []).map(x =>
    [esc(x.area), esc(x.kind), esc(x.note)]));
  html += table('Areas', ['Area', 'Status', 'Kept', 'Why'], (d.areas || []).map(x =>
    [esc(x.area), esc(x.status), esc(x.kept), esc(x.why)]));
  html += table('Changes from the starting tree', ['File', 'Why'], (d.changes || []).map(x =>
    [`<span class="mono">${esc(x.path)}</span>`, esc(x.why)]));
  html += table('Carry-forward decisions', ['Item', 'Decision', 'Why'], (d.carry_forward_dispositions || []).map(x =>
    [esc(x.item_id), esc(x.status), esc(x.why)]));
  if ((d.incorporated_from_other || []).length)
    html += `<h4>Taken from the other candidate</h4><div class="mono">${d.incorporated_from_other.map(esc).join('<br>')}</div>`;
  return html;
}

// ----------------------------------------------------------------- loop
let pending = false;
function render() {
  pending = false;
  const nums = roundNumbers();
  if (follow || !nums.includes(selected)) selected = state.round && nums.includes(state.round) ? state.round : nums[nums.length - 1] || null;
  renderHeader(); renderTabs(); renderSteps();
  renderAgent(0); renderAgent(1);
  renderGates(); renderDivergence();
}
const schedule = () => { if (!pending) { pending = true; requestAnimationFrame(render); } };

async function poll() {
  const next = parse(await api('state'));
  if (!next) return;
  state = next;
  // agent order normally comes from the events; fall back to state.json before any event arrives
  for (const name of Object.keys(state.agents || {})) if (!names.includes(name) && names.length < 2) names.push(name);
  schedule();
}

let lastSeq = 0;
function connect() {
  const es = new EventSource(`/${TOKEN}/events?after=${lastSeq}`);
  es.onmessage = (m) => {
    const e = parse(m.data);
    if (!e || (e.seq || 0) <= lastSeq) return;
    lastSeq = e.seq;
    apply(e);
    schedule();
  };
  es.onerror = () => { es.close(); setTimeout(connect, 2000); };
}

cardSkeleton(0); cardSkeleton(1);
poll(); connect();
setInterval(poll, 2000);
setInterval(schedule, 1000);   // keeps elapsed / idle ticking
</script>
</body>
</html>
