<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CAV</title>
<style>
  :root { --bg:#0e1013; --panel:#16191d; --line:#262b31; --fg:#e9edf1; --dim:#8b949e;
          --ok:#3fb950; --warn:#d29922; --bad:#f85149; --accent:#58a6ff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin:0; background:var(--bg); color:var(--fg); display:flex; flex-direction:column;
         font:16px/1.55 -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding:16px 22px 10px; border-bottom:1px solid var(--line); }
  .top { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  h1 { font-size:22px; margin:0; font-weight:650; letter-spacing:-0.01em; }
  .meta { color:var(--dim); font-size:15px; }
  .pills { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .pill { font-size:14px; padding:3px 11px; border-radius:999px; border:1px solid var(--line); color:var(--dim); }
  .pill b { color:var(--fg); font-weight:600; }
  .pill.ok { border-color:var(--ok); color:var(--ok); }
  .pill.bad { border-color:var(--bad); color:var(--bad); }
  .pill.warn { border-color:var(--warn); color:var(--warn); }

  nav { display:flex; gap:8px; padding:12px 22px; border-bottom:1px solid var(--line); overflow-x:auto; }
  nav button { font:inherit; font-size:15px; padding:6px 14px; border-radius:8px; cursor:pointer;
               background:transparent; color:var(--dim); border:1px solid var(--line); white-space:nowrap; }
  nav button:hover { color:var(--fg); }
  nav button.on { background:#1d242c; color:var(--fg); border-color:var(--accent); }

  main { flex:1; display:grid; grid-template-columns:1fr 1fr; gap:16px; padding:16px 22px 22px; min-height:0; }
  .agent { background:var(--panel); border:1px solid var(--line); border-radius:10px;
           display:flex; flex-direction:column; min-height:0; }
  .ahead { display:flex; align-items:center; justify-content:space-between; padding:12px 16px 8px; }
  .ahead h2 { font-size:18px; margin:0; font-weight:650; }
  .state { font-size:14px; padding:2px 10px; border-radius:999px; border:1px solid var(--line); }
  .state.run { color:var(--warn); border-color:var(--warn); }
  .state.done { color:var(--ok); border-color:var(--ok); }
  .state.err { color:var(--bad); border-color:var(--bad); }
  .act { padding:0 16px 10px; color:var(--dim); font-size:14px; min-height:21px; }
  .act b { color:var(--accent); font-weight:600; }
  .msgs { flex:1; overflow-y:auto; padding:6px 16px 16px; display:flex; flex-direction:column; gap:10px; }
  .msg { background:#11151a; border:1px solid #1f252c; border-radius:8px; padding:9px 12px;
         white-space:pre-wrap; word-break:break-word; font-size:15px; line-height:1.55; }
  .msg .t { display:block; color:#5c6773; font-size:12px; margin-bottom:3px; letter-spacing:.02em; }
  .empty { color:var(--dim); font-size:14px; font-style:italic; }

  .wide { grid-column:1 / -1; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .wide h2 { font-size:14px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:0 0 10px; }
  .totals { font-size:15px; color:var(--dim); margin-bottom:10px; }
  .totals b { color:var(--fg); }
  .files { list-style:none; margin:0; padding:0; max-height:170px; overflow:auto; }
  .files li { padding:4px 0; cursor:pointer; font-size:14px; display:flex; gap:10px; align-items:baseline; }
  .files li:hover .path { color:var(--accent); }
  .cls { font-size:12px; padding:1px 7px; border-radius:5px; border:1px solid var(--line); color:var(--dim); min-width:78px; text-align:center; }
  .cls.substantive { color:var(--bad); border-color:var(--bad); }
  .cls.comments_candidate { color:var(--warn); border-color:var(--warn); }
  pre { background:#0b0e11; border:1px solid var(--line); border-radius:8px; padding:12px;
        overflow:auto; max-height:340px; margin:12px 0 0; font-size:13px; line-height:1.5; }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1 id="case">CAV</h1>
    <span class="meta" id="meta"></span>
  </div>
  <div class="pills" id="pills"></div>
</header>
<nav id="rounds"></nav>
<main>
  <section class="agent" id="agent0">
    <div class="ahead"><h2 id="name0">—</h2><span class="state" id="state0"></span></div>
    <div class="act" id="act0"></div>
    <div class="msgs" id="msgs0"></div>
  </section>
  <section class="agent" id="agent1">
    <div class="ahead"><h2 id="name1">—</h2><span class="state" id="state1"></span></div>
    <div class="act" id="act1"></div>
    <div class="msgs" id="msgs1"></div>
  </section>
  <section class="wide">
    <h2>What they disagree on <span class="meta" id="diffround"></span></h2>
    <div class="totals" id="totals"></div>
    <ul class="files" id="files"></ul>
    <pre id="diff" hidden></pre>
  </section>
</main>

<script>
const TOKEN = location.pathname.split('/').filter(Boolean)[0];
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clone = (o) => JSON.parse(JSON.stringify(o || {}));

let state = {};
let selected = null;          // selected round number
let agents = [];
let lastSeq = 0;
const seen = {};              // agent -> highest message seq rendered

const getJSON = async (url) => {
  try { const r = await fetch(url, {cache:'no-store'}); return await r.json(); }
  catch (e) { return null; }
};

function roundData(n) {
  return (state.history || []).find(h => h.round === n) || null;
}

function pills() {
  const b = state.blockers || {};
  const out = [];
  const v = b.verdict || state.phase;
  out.push(`<span class="pill ${v === 'functional' || v === 'strict' ? 'ok' : 'warn'}"><b>${esc(v || '—')}</b></span>`);
  if (b.checks !== undefined)
    out.push(`<span class="pill ${b.checks ? 'ok' : 'bad'}">checks <b>${b.checks ? 'pass' : 'fail'}</b></span>`);
  if (b.blocking_must_fix !== undefined)
    out.push(`<span class="pill ${b.blocking_must_fix ? 'bad' : 'ok'}">blocking <b>${b.blocking_must_fix}</b></span>`);
  const appr = (b.behaviour_approved || []);
  if (appr.length)
    out.push(`<span class="pill ${appr.every(Boolean) ? 'ok' : 'warn'}">approved <b>${appr.filter(Boolean).length}/${appr.length}</b></span>`);
  document.getElementById('pills').innerHTML = out.join('');
}

function rounds() {
  const nav = document.getElementById('rounds');
  const numbers = (state.history || []).map(h => h.round);
  if (state.round && !numbers.includes(state.round)) numbers.push(state.round);
  if (!numbers.length) { nav.innerHTML = ''; return; }
  if (selected === null || !numbers.includes(selected))
    selected = state.round && numbers.includes(state.round) ? state.round : numbers[numbers.length - 1];
  nav.innerHTML = numbers.map(n => {
    const d = roundData(n);
    const v = d ? (d.verdict || 'failed') : 'running';
    const live = n === state.round && state.phase !== 'converged';
    return `<button data-r="${n}" class="${n === selected ? 'on' : ''}">Round ${n}` +
           `<span class="meta"> · ${esc(live ? 'running' : v)}</span></button>`;
  }).join('');
  nav.querySelectorAll('button').forEach(b => b.onclick = () => selectRound(+b.dataset.r));
}

function selectRound(n) {
  if (n === selected) return;
  selected = n;
  for (const a of agents) { seen[a] = 0; document.getElementById('msgs' + agents.indexOf(a)).innerHTML = ''; }
  document.getElementById('diff').hidden = true;
  document.getElementById('files').innerHTML = '';
  rounds(); renderAgents(); loadDiff(); loadMessages();
}

function agentCard(i, name) {
  const live = selected === state.round && state.phase !== 'converged';
  const hist = roundData(selected);
  const res = hist && hist.results ? hist.results[name] : null;
  const a = live ? (state.agents || {})[name] : null;
  document.getElementById('name' + i).textContent = name;
  const st = document.getElementById('state' + i);
  if (a) {
    st.textContent = a.state || '—';
    st.className = 'state ' + (a.state === 'done' ? 'done' : a.error ? 'err' : 'run');
    const act = [a.detail, a.elapsed !== undefined ? `${a.elapsed}s` : ''].filter(Boolean).join(' · ');
    document.getElementById('act' + i).innerHTML = `<b>${esc(a.detail || '')}</b> ${a.elapsed !== undefined ? esc(a.elapsed + 's elapsed') : ''}`
      + (a.error ? ` — <span style="color:var(--bad)">${esc(a.error)}</span>` : '');
  } else if (res) {
    st.textContent = 'finished';
    st.className = 'state done';
    document.getElementById('act' + i).innerHTML =
      `commit <b>${esc(String(res.commit || '').slice(0, 10))}</b> · blocking ${res.blocking} · approved ${res.approved}/${res.other_approved}`;
  } else {
    st.textContent = '—'; st.className = 'state';
    document.getElementById('act' + i).textContent = '';
  }
}

function renderAgents() {
  agents = Object.keys(state.agents || {});
  if (!agents.length) {
    const h = roundData(selected);
    if (h && h.results) agents = Object.keys(h.results);
  }
  while (agents.length < 2) agents.push(agents.length ? 'agent 2' : 'agent 1');
  agentCard(0, agents[0]); agentCard(1, agents[1]);
}

function addMessage(i, msg) {
  const box = document.getElementById('msgs' + i);
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
  const div = document.createElement('div');
  div.className = 'msg';
  div.innerHTML = `<span class="t">${esc((msg.ts || '').slice(11, 19))}</span>${esc(msg.text)}`;
  box.appendChild(div);
  while (box.childElementCount > 400) box.firstChild.remove();
  if (nearBottom) box.scrollTop = box.scrollHeight;
}

async function loadMessages() {
  for (let i = 0; i < 2; i++) {
    const name = agents[i];
    const box = document.getElementById('msgs' + i);
    box.innerHTML = '';
    const list = await getJSON(`/${TOKEN}/api/messages?round=${selected}&agent=${encodeURIComponent(name)}`);
    if (!Array.isArray(list) || !list.length) {
      box.innerHTML = '<div class="empty">no messages yet</div>';
      seen[name] = 0;
      continue;
    }
    box.innerHTML = '';
    let max = 0;
    for (const m of list) { addMessage(i, m); max = Math.max(max, m.seq || 0); }
    seen[name] = max;
    box.scrollTop = box.scrollHeight;
  }
}

async function loadDiff() {
  const d = await getJSON(`/${TOKEN}/api/divergence?round=${selected}`);
  const files = (d && d.files) || {};
  const t = (d && d.totals) || {};
  document.getElementById('diffround').textContent = `round ${selected}`;
  if (!t.identical && !t.substantive && !t.comments_candidate && !t.formatting_candidate) {
    document.getElementById('totals').textContent = 'not computed yet for this round';
    document.getElementById('files').innerHTML = '';
    return;
  }
  document.getElementById('totals').innerHTML =
    `<b>${t.substantive || 0}</b> substantive · ${t.comments_candidate || 0} comment-only · ` +
    `${t.formatting_candidate || 0} formatting-only · <b>${t.identical || 0}</b> identical`;
  const order = ['substantive', 'binary', 'comments_candidate', 'formatting_candidate'];
  const rows = [];
  for (const cls of order) for (const p of (files[cls] || [])) rows.push({cls, p});
  document.getElementById('files').innerHTML = rows.length ? rows.map(r =>
    `<li data-p="${esc(r.p)}"><span class="cls ${r.cls}">${esc(r.cls.replace('_candidate',''))}</span><span class="path">${esc(r.p)}</span></li>`
  ).join('') : '<li class="empty">the two candidates are identical</li>';
  document.querySelectorAll('#files li[data-p]').forEach(li => li.onclick = async () => {
    const body = await getJSON(`/${TOKEN}/api/diff?round=${selected}&path=${encodeURIComponent(li.dataset.p)}`);
    const pre = document.getElementById('diff');
    pre.hidden = false;
    pre.textContent = (body && body.diff) || '(no diff)';
  });
}

function connect() {
  if (!window.EventSource) return;
  const es = new EventSource(`/${TOKEN}/events?after=${lastSeq}`);
  es.onmessage = (m) => {
    let e; try { e = JSON.parse(m.data); } catch (x) { return; }
    lastSeq = Math.max(lastSeq, e.seq || 0);
    const text = (e.data && e.data.text) || '';
    if (e.type === 'agent.text' && e.round === selected && e.agent && text.trim()) {
      const i = agents.indexOf(e.agent);
      if (i >= 0 && (e.seq || 0) > (seen[e.agent] || 0)) {
        seen[e.agent] = e.seq;
        const box = document.getElementById('msgs' + i);
        if (box.querySelector('.empty')) box.innerHTML = '';
        addMessage(i, {ts: e.ts, text});
      }
    }
  };
  es.onerror = () => { es.close(); setTimeout(connect, 3000); };
}

let lastHistory = -1;
async function refresh() {
  const next = await getJSON(`/${TOKEN}/api/state`);
  if (!next) return;
  const prevRound = state.round;
  const followLive = selected === null || selected === prevRound;
  state = next;
  document.getElementById('case').textContent = state.case || 'CAV';
  document.getElementById('meta').textContent =
    `round ${state.round ?? '—'} of ${(state.history || []).length || '—'} · ${state.phase || ''}` +
    (state.final ? ` · final ${String(state.final.commit).slice(0, 10)}` : '');
  const movedRound = followLive && prevRound !== undefined && state.round !== prevRound;
  if (movedRound) selected = state.round;
  pills(); rounds(); renderAgents();
  const historyLen = (state.history || []).length;
  if (movedRound) { loadMessages(); loadDiff(); }
  else if (historyLen !== lastHistory) loadDiff();
  lastHistory = historyLen;
}

(async function start() {
  await refresh();
  loadDiff();
  loadMessages();
  connect();
  setInterval(refresh, 2000);
})();
</script>
</body>
</html>
