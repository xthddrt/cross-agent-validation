<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAV compare</title>
<style>
  :root {
    color-scheme: dark;
    --bg:#0d1117; --panel:#161b22; --sunk:#0f141a; --line:#2a313a; --fg:#e6edf3; --dim:#8b949e;
    --ok:#3fb950; --ok-bg:#12261a; --warn:#d29922; --warn-bg:#2a2210; --bad:#f85149; --bad-bg:#2d1416;
    --accent:#58a6ff; --accent-bg:#11233a;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 system-ui, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width:1400px; margin:0 auto; padding:18px 20px 40px; display:flex; flex-direction:column; gap:16px; }
  header { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  header h1 { font-size:20px; margin:0; }
  header a { color:var(--accent); text-decoration:none; }
  .dim { color:var(--dim); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; min-width:0; }
  h2 { font-size:13px; font-weight:600; color:var(--dim); text-transform:uppercase; letter-spacing:.05em; margin:0 0 10px; }
  h3 { margin:0; font-size:17px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .badge { font-weight:600; font-size:12.5px; padding:2px 10px; border-radius:999px; background:var(--sunk); color:var(--dim); }
  .badge.ok { background:var(--ok-bg); color:var(--ok); } .badge.bad { background:var(--bad-bg); color:var(--bad); }
  .badge.run { background:var(--accent-bg); color:var(--accent); } .badge.warn { background:var(--warn-bg); color:var(--warn); }
  .big { font-size:26px; font-weight:650; font-variant-numeric:tabular-nums; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:4px 14px; margin-top:10px; font-size:13.5px; }
  .kv span:nth-child(odd) { color:var(--dim); }
  table { border-collapse:collapse; width:100%; font-size:13px; margin-top:10px; }
  th, td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--dim); font-weight:600; font-size:12px; }
  td.n { font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap; }
  .mono { font-family:var(--mono); font-size:12.5px; }
  .bar { height:6px; border-radius:3px; background:var(--accent); min-width:2px; }
  .ok { color:var(--ok); } .bad { color:var(--bad); } .warn { color:var(--warn); }
  .answer { font-size:15px; line-height:1.6; }
  @media (max-width: 900px) { .grid { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Compare runs</h1><a href="../">← All runs</a><span class="dim" id="stamp"></span></header>
  <section class="card"><h2>Did they reach the same conclusion?</h2><div id="answer" class="answer dim">loading…</div></section>
  <section class="grid" id="runs"></section>
  <section class="card"><h2>Result vs the original branches (changed lines · files)</h2><div id="originals"></div></section>
</div>
<script>
const BASE = location.pathname.replace(/\/compare\/?$/, '');
const ids = new URLSearchParams(location.search).get('runs') || '';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function dur(sec) {
  if (sec == null) return '–';
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return h ? `${h}h ${String(m).padStart(2, '0')}m` : m ? `${m}m ${String(s).padStart(2, '0')}s` : `${s}s`;
}
const verdictCls = (v) => v === 'accepted' || v === 'forced' ? 'ok' : v === 'diverged' || v === 'failed' ? 'bad' : v === 'running' ? 'warn' : 'dim';
const nearest = (dists) => Object.entries(dists).sort((a, b) => a[1].lines - b[1].lines)[0];

function runCard(r) {
  const cls = r.live ? 'run' : /agreed|merged/.test(r.outcome) ? 'ok' : 'bad';
  const max = Math.max(1, ...r.rounds.map(x => x.seconds));
  const rows = r.rounds.map(x => `<tr><td>${esc(x.stage || '–')}</td><td>r${x.round}</td>` +
    `<td class="n">${dur(x.seconds)}</td><td style="width:22%"><div class="bar" style="width:${100 * x.seconds / max}%"></div></td>` +
    `<td class="${verdictCls(x.verdict)}">${esc(x.verdict)}${x.method ? `<div class="dim" style="font-size:12px">${esc(x.method)}</div>` : ''}</td>` +
    `<td class="n">${x.differing ?? '–'}</td><td class="n">${x.must_fix ?? '–'}</td>` +
    `<td class="dim" style="font-size:12px">${Object.entries(x.agents).map(([a, s]) => `${esc(a)} ${dur(s)}`).join('<br>')}</td></tr>`).join('');
  const stages = Object.entries(r.stages).map(([s, sec]) => `${esc(s)} ${dur(sec)}`).join(' · ');
  const plan = r.plan ? `<span>Plan</span><span>${esc(r.plan.outcome || '–')}${r.plan.rounds ? ` in ${r.plan.rounds} rounds` : ''}` +
    `${r.plan.base ? ` · base <b>${esc(r.plan.base)}</b>` : ''}</span>` : '';
  return `<div class="card"><div class="row"><h3><a href="${BASE}/run/${encodeURIComponent(r.id)}/" style="color:inherit">${esc(r.id)}</a></h3>` +
    `<span class="badge ${cls}">${esc(r.outcome)}</span><span class="dim">${esc(r.kind === 'pipeline' ? 'plan first, blind' : 'reconcile code directly')}</span></div>` +
    `<div class="big" style="margin-top:8px">${dur(r.seconds)}${r.live ? ' <span class="dim" style="font-size:14px">so far</span>' : ''}</div>` +
    `<div class="kv"><span>Stages</span><span>${stages || '–'}</span>${plan}<span>Rounds</span><span>${r.rounds.length}</span></div>` +
    `<table><tr><th>Stage</th><th>Round</th><th class="n">Time</th><th></th><th>Verdict</th><th class="n">Paths differ</th><th class="n">MUST_FIX</th><th>Agent time</th></tr>${rows}</table></div>`;
}

function render(data) {
  $('runs').innerHTML = data.runs.map(runCard).join('');
  const origins = data.originals;
  const rows = data.runs.flatMap(r => Object.entries(r.to_originals || {}).map(([label, dists]) => {
    const near = nearest(dists);
    return `<tr><td>${esc(r.id)}</td><td>${esc(label)}</td>` +
      origins.map(o => `<td class="n mono">${dists[o] ? `${dists[o].lines} · ${dists[o].files}` : '–'}</td>`).join('') +
      `<td>${near ? `closest to <b>${esc(near[0])}</b>` : ''}</td></tr>`;
  }));
  $('originals').innerHTML = rows.length
    ? `<table><tr><th>Run</th><th>Result</th>${origins.map(o => `<th class="n">${esc(o)}</th>`).join('')}<th></th></tr>${rows.join('')}</table>` +
      (Object.keys(data.closeness).length ? `<table><tr><th>Between the runs</th><th class="n">changed lines · files</th></tr>` +
        Object.entries(data.closeness).map(([k, v]) => `<tr><td>${esc(k)}</td><td class="n mono">${v.lines} · ${v.files}</td></tr>`).join('') + '</table>' : '')
    : '<div class="dim">No result commits yet.</div>';

  // the plain-language answer, from the facts above
  const parts = data.runs.map(r => {
    const results = Object.entries(r.to_originals || {});
    const leans = results.map(([label, d]) => `${label} is closest to ${nearest(d) ? nearest(d)[0] : '?'}`);
    if (r.live && !results.length) return `<b>${esc(r.id)}</b> is still running (${esc(r.outcome)})` +
      (r.plan && r.plan.base ? `; its agreed plan builds on <b>${esc(r.plan.base)}</b>` : '') + '.';
    return `<b>${esc(r.id)}</b>: ${esc(r.outcome)}` + (r.plan && r.plan.base ? `, plan base <b>${esc(r.plan.base)}</b>` : '') +
      (leans.length ? ` — ${esc(leans.join('; '))}` : '') + '.';
  });
  $('answer').classList.remove('dim');
  $('answer').innerHTML = parts.join('<br>');
  $('stamp').textContent = `updated ${new Date().toLocaleTimeString()}` + (data.runs.some(r => r.live) ? ' · refreshes every 20s' : '');
  if (data.runs.some(r => r.live)) setTimeout(load, 20000);
}

async function load() {
  try {
    const r = await fetch(`${BASE}/api/compare?runs=${encodeURIComponent(ids)}`, {cache:'no-store'});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || r.status);
    render(data);
  } catch (e) { $('answer').textContent = `Could not load: ${e.message}`; setTimeout(load, 20000); }
}
load();
</script>
</body>
</html>
